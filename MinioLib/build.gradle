plugins {
    id 'com.android.library'
}

android {
    namespace 'com.xiaoming.miniolib'
    compileSdk 36

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // api: these types leak through MinioClient's public signatures (old `compile`)
    api 'com.squareup.okhttp3:okhttp:3.6.0'
    api 'com.fasterxml.jackson.core:jackson-core:2.9.0.pr3'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.9.0.pr3'
    api 'com.fasterxml.jackson.core:jackson-databind:2.9.0.pr3'
    api 'com.google.code.findbugs:annotations:2.0.1'
    api 'joda-time:joda-time:2.7'
    api 'com.google.guava:guava:18.0'
    api('com.google.http-client:google-http-client:1.20.0') {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }
    api('com.google.http-client:google-http-client-xml:1.20.0') {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
